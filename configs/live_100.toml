# Small live-size account on the default $1.00 / $1.50 TP ladder, stops from with_stops (on for now).
name = "live_100"
sides = "short"  # Analyst bias operational (2026-10-14 08:40 MT)

[market]
base_tf = "15m"                # live klines interval (= signal TF)

[signal]
tf = "15m"                     # RSI entries/adds on 15m; trend stays 4h EMA200
oversold = 45.0                # long entries (uptrend) when 15m RSI < 45
overbought = 55.0              # short entries (downtrend) when 15m RSI > 55
# max_flat_minutes omitted = flat rule off (it had a liquidation in the 3-month check)
# idle loosening (Trevor 2026-10-07 20:14 MT): flat with no entry >= 60 min -> step 1 (long < 48 / short > 52),
# +30 min -> step 2 (long < 50 / short > 50), capped; resets on the next entry. Trend filter / PAUSE_UNTIL / KILL still apply.
idle_enabled = true
idle_after_min = 60.0
idle_step_min = 30.0
idle_long_rsi_steps = [48.0, 50.0]
idle_short_rsi_steps = [52.0, 50.0]
idle_max_long_rsi = 50.0
idle_min_short_rsi = 50.0

[account]
start_equity = 100.0

[tp]
mode = "price_abs"            # levels dist below are USD (default price_pct would read 0.45 as 45%)
levels = [{ dist = 0.45, close_pct = 0.5 }, { dist = 0.75, close_pct = 1.0 }]   # Trevor 20:57 MT: TP1 = 60% of TP2 distance
close_remainder_after_min = 55.0
# smart TP2 / TP1 sanity (Trevor 2026-10-07 20:14 MT): at open, after each add and every tp_check_min
smart_tp2 = true
tp1_pct = 0.0064             # Trevor 2026-10-24: -20% (was 0.008). TP1 = avg x (1 -/+ 0.64%), short below / long above avg
tp2_pct = 0.012              # Trevor 2026-10-24: -20% (was 0.015). TP2 = avg x (1 -/+ 1.2%); fee floors / min gap / market clamp still apply; levels give close_pct only
tp_min_net_usd = 0.05          # each TP's closing chunk nets >= $0.05 after 6 bps open + 6 bps close fees
tp_min_gap_usd = 0.05          # TP1 at least $0.05 inside TP2
tp_min_move = 0.05             # periodic re-place only when a TP moves >= $0.05
tp_market_gap = 0.02           # trigger always >= $0.02 beyond market

[stops]
# margin_loss_pct removed (off) by Trevor's choice
trend_flip_exit = false        # trend only filters NEW entries (Trevor)
# daily_loss_pct removed (off) by Trevor's choice

[live]
dry_run = false
max_collateral_usd = 1.0e12      # cap removed (Trevor): available = wallet SOL - sol_fee_reserve, re-read every loop
max_position_usd = 1.0e12        # notional ceiling removed: redundant with max_leverage 30 per entry (notional <= 30x collateral <= 30x wallet)
max_leverage = 20.0
sol_fee_reserve = 0.02
max_daily_loss_usd = 1.0e12        # effectively off (Trevor's choice)
min_collateral_usd = 10.0
kill_switch_path = "live/KILL"
close_all_on_kill = false

[dca]
max_adds = 100000              # effectively unlimited; wallet / liq rule stop adds
mode = "levels"                # adds at analyst support/resistance ("fixed" = trigger_dist spacing)
levels_path = "/workspace/market-analysis/latest.json"
levels_max_age_min = 45.0      # stale/missing -> fixed trigger_dist spacing
min_gap_atr = 0.3              # gap from last fill to the add level, in 1h ATR
max_gap_atr = 1.2              # no level within 2x ATR -> fixed spacing
target_avg_atr = 1.0           # size add so new avg lands 1x ATR below the next resistance (longs)
min_add_usd = 10.0              # floor per add (capped at available)
max_add_frac = 1.0             # optional extra per-add cap (fraction of free collateral); 1.0 = off, the ladder budgets instead
# --- target guard (2026-10-07 16:30 root-cause fix of the all-in add) ---
min_target_gap_atr = 0.5       # sizing target must sit >= 0.5 ATR above the add price
target_flipped_supports = false  # broken supports (above the add price) are never the sizing target
min_avg_gap_atr = 0.25         # wanted avg >= 0.25 ATR above the add price (bounds the size formula)
fallback_avg_frac = 0.5        # target unreachable: want avg = avg - 0.5 * (avg - add price)
# --- ladder budgeting: whole wallet spread over the remaining rungs, deeper rungs get more ---
ladder_enabled = true
ladder_sizing = "budget"       # each add = its rung budget ("min" = min(formula, budget)); $3 floor, liq check shrinks
ladder_min_rungs = 4           # rolling ladder once price is past the deep level: 4 rungs + a new deep level
ladder_max_rungs = 10          # 2026-10-09 15:08 config B (ladder sim): 14 main rungs
ladder_fixed_usd = 10.0         # 2026-10-12 preset C LIVE (Trevor 00:04 MT): flat $10 per rung
ladder_weight_mode = "accel"   # 2026-10-09 config B: ratio 1.15, +0.10 per rung, cap 2.5; $3 min fitted inside the budget
ladder_weight_mult = 1.15
ladder_weight_mult_step = 0.10
ladder_weight_mult_cap = 2.5
ladder_deep = false  # 2026-10-12 preset C/resting LIVE (Trevor 00:04 MT)
ladder_deep_anchor = "first_entry"  # deep level stays put (rungs shrink toward it, budgets grow, it takes the rest)
ladder_deep_min_atr = 6.0      # deep = deepest analyst support 6-12 ATR below the first entry ...
ladder_deep_max_atr = 12.0
ladder_deep_atr = 8.0          # ... else first entry - 8 ATR
ladder_fee_usd_per_add = 0.10  # per-rung network/request fee reserve taken off free collateral
reference = "last_entry"     # adds spaced from the previous fill, not the moving average
require_signal = false         # adds on price distance alone
add_margin_usd = 5.0           # fixed mode only; levels mode sizes adds dynamically
lev_start = 5.0  # 2026-10-12 preset C/resting LIVE (Trevor 00:04 MT)
lev_step = 2.5  # 2026-10-12 preset C/resting LIVE (Trevor 00:04 MT)
lev_cap = 20.0  # 2026-10-12 preset C/resting LIVE (Trevor 00:04 MT)
require_liq_beyond_next_level = true
liq_buffer_atr = 2.0           # levels mode: post-add liq >= 2 ATR below the next rung (else the add is shrunk)
trigger_mode = "price_abs"
trigger_dist = 0.85            # fixed spacing / levels-mode fallback
allow_after_partial = true

[sizing]
mode = "fixed_usd"  # Jupiter min collateral is $10; 10% of $100 would sit right at it
initial_margin_usd = 10.0  # 2026-10-12 preset C/resting LIVE (Trevor 00:04 MT)

[entry]
# Trevor 2026-10-07 18:24 MT: first entry scales with the wallet ("fixed" = the [sizing] $10.50 above).
first_collateral_mode = "fixed"  # 2026-10-12 preset C/resting LIVE (Trevor 00:04 MT)
first_collateral_pct = 0.10     # fraction of free native-SOL collateral (wallet SOL - 0.02 reserve, USD) at each fresh open
first_collateral_min_usd = 10.50  # floor: Jupiter's $10 TP minimum always met
# first_collateral_max_usd = 50.0  # optional cap (omitted = off)
fee_reserve_usd = 0.10          # first entry <= free collateral - this; adds then budget from what is left

[withdraw]
enabled = true                 # daily realized-profit sweep (Trevor enabled 2026-10-07)
address = "59su4N4uaKcN8YZtYYgBj9kdUGytJgAF6HBTiyxzjGzp"   # any other address is rejected
time_mt = "00:05"
mode = "stake_jupsol"          # Trevor 2026-10-07 17:59: stake the profit as JupSOL in the bot wallet ("send" = old SOL send to address)
amount = "realized_profit_sol" # realized net SOL of trades closed since last run (ledger), carried if uncovered/<min
min_send_sol = 0.01            # minimum for SEND mode only; less (or a loss) carries forward
# stake_jupsol minimum (Trevor 18:26 MT, replaces the 0.01 for staking): stake ALL realized profit when
# profit > min_stake_fee_mult x (stake_fee_est_sol + profit x stake_slippage_bps), and >= min_stake_floor_sol; else carry
min_stake_fee_mult = 3.0
min_stake_floor_sol = 0.0005
stake_fee_est_sol = 0.00001    # network + priority fee per swap (observed ~0.0000053-0.0000058 SOL)
require_next_add_cover = false # Trevor 18:27 MT: daily stake runs with or without an open trade; only native SOL >= 0.02 reserve
                               # + stake_fee_buffer_sol is enforced (stake what fits, carry the rest). Send mode unchanged.
# --- stake bucket (JupSOL in the bot wallet; never bot margin; live/stake.py status|unstake|send-to-withdraw) ---
stake_mint = "jupSoLaHXQiZZTSfEWMTRRgpnyFm8f6sZdosWBjx93v"   # locked to JupSOL
stake_slippage_bps = 50        # SOL -> JupSOL
unstake_slippage_bps = 50      # JupSOL -> SOL
stake_max_slippage_bps = 100   # cap for CLI --slippage-bps overrides (hard max 300)
stake_max_price_impact_pct = 0.5
stake_only_direct_routes = false
stake_fee_buffer_sol = 0.003   # free SOL kept on top of sol_fee_reserve + next add (swap fee, one-time ATA rent)
stake_api_bases = ["https://api.jup.ag/swap/v1", "https://lite-api.jup.ag/swap/v1"]   # Jupiter Swap API v1, tried in order
# multi-asset (Trevor 2026-10-07 20:23 MT): this SOL bot runs the ONE daily stake over every bot's realized trades
trade_files = ["live/trades.csv", "live/eth/trades.csv", "live/btc/trades.csv"]

[bot]
# multi-asset (Trevor approved 2026-10-07 20:23 MT): SOL 50% / ETH 25% / BTC 25% of ONE wallet (live/budget.py).
# free collateral = share x (native SOL - reserve + every bot's open collateral) - own open collateral, capped at native free.
asset = "SOL"
share = 0.5
state_dir = "live"             # unchanged paths: live/state.json, live/trades.csv, live/KILL, live/PAUSE_UNTIL, live/logs/
global_kill_path = "live/KILL_ALL"   # touch to stop new orders on all three bots
extra_pause_files = ["live/PAUSE_UNTIL"]   # event pause (same as ETH/BTC; the SOL path is the same file)

[trim]
# Time-based per-add trim (Trevor 2026-10-08 13:00 MT; SOL only, code default OFF for backtests / ETH / BTC).
# Position under water for trim_after_hours since the clock reference (last add, or the open if no adds; a net-positive
# moment restarts the wait) -> every add lot (never the first entry) whose own gain >= 6+6 bps + network est + $0.25
# and >= 0.5 % is market-closed for exactly its size; collateral stays, its rung re-arms, TPs re-placed for the new size.
enabled = true
trim_after_hours = 4.0
trim_clock = "last_add"        # "last_add" | "open"
trim_min_net_usd = 0.0         # Trevor 2026-10-11 14:03 MT: no minimum (was 0.25); lot qualifies once net of fees > 0.        # also the overall-net floor of the whole trade (trims + final TPs) once it has trims
trim_min_gain_pct = 0.0        # Trevor 2026-10-11 14:03 MT: no minimum (was 0.005).      # 0.5 % (fraction)
trim_network_usd = 0.02        # est. network fees per trim
trim_check_min = 1.0           # every loop tick
trim_max_per_day = 0           # 0 = no daily limit
# Trigger (Trevor 2026-10-08 17:06 MT) replaces the time gate: ARM when price is > trim_arm_dist_pct against the avg
# (long <= avg x (1 - x), short >= avg x (1 + x)); stays armed until flat (state.json). While armed, TRIGGER when price
# reaches an analyst resistance (long) / support (short) within trim_level_tol_atr x 1h ATR -> close every eligible add
# (rule above) in one market decrease. Levels stale/missing -> no trim. trim_trigger = "time" restores trim_after_hours.
trim_trigger = "distance_level"
trim_arm_dist_pct = 0.0065      # 0.65 % (Trevor 2026-10-12 20:29 MT, back from 0.01)
trim_level_tol_atr = 0.05          # Trevor 2026-10-11 20:48 MT: partial fires 0.05 ATR before the level (total; was 0.1 tol + 0.15 front-run = 0.25)
trim_level_front_run_atr = 0.0    # Trevor 2026-10-11 20:48 MT (was 0.15)
trim_level_front_run_pct = 0.0   # 0.15 x 1h ATR + pct x level; total trigger distance = front_run + tol (0.25 ATR)

[profit_guard]
# Wallet-baseline profit guard (Trevor 2026-10-08 17:11 MT; SOL only): baseline = this bot's free budget share in SOL
# just before the open (state.json, reset on flat). The trade must end >= baseline + max(min_trade_profit_sol,
# min_trade_profit_pct x baseline) in SOL after every deposit, trim / TP payout, fee and network cost: pending TPs are
# raised to meet it and the TP timer only closes when closing now meets it. 0.001 SOL (~$0.11) keeps a normal first-entry
# TP ladder (~+0.002 SOL) unchanged; 0.5 % of the ~0.88 SOL baseline (~0.0044 SOL) would widen every TP, so pct is 0 for now.
enabled = true                 # re-enabled 2026-10-08 18:03 MT (payout fix; tracking + market-close mode, never moves TPs)
close_when_met = true          # owner 18:02 MT: guard action = market-close the whole position once closing now ends >= baseline + min (never moves TPs)
close_requires = "adds_or_trims"   # only positions with >= 1 add or trim; "any" = every position
min_trade_profit_sol = 0.001
min_trade_profit_pct = 0.0
close_network_sol = 0.00002

[ledger]
guard_only_underwater = true   # Trevor 2026-10-11 06:31 MT: profit guard close only while underwater (long px<avg, short px>avg); TP timer unchanged
# Per-bot own-coin ledger + HWM (Trevor 2026-10-08 21:37 MT, live/bank.py). This bot's balance lives in SOL (state.json "bank");
# trades fund from / pay back into it only (shorts: keeper swaps SOL -> USDC in the request, USDC payouts swept back to SOL).
# Profit guard: market-close the whole position (adds/trims only) once equity if closed now >= hwm + min_profit_native.
# HWM rises only while flat. Unexplained wallet changes >= ext_min_usd: ALERT only (ext_flow_mode), never P&L, never charged to the bots.
enabled = true
min_profit_native = 0.0015         # SOL (~$0.17; owner 2026-10-09 08:46 MT, was 0.001)
min_profit_pct_hwm = 0.002            # Trevor 2026-10-12: replaces min_profit_native: target = hwm x (0.2% +
min_profit_pct_per_partial = 0.0005   #   0.05% x partials taken this trade [trims + TP3 fills])
swap_cost_pct = 0.002           # est. USDC -> coin swap cost in the guard's close value (ETH/BTC shorts)
ext_min_usd = 1.5
ext_flow_mode = "alert"       # Trevor 2026-10-11 19:08 MT: unexplained wallet change -> WARNING + live/EXT_FLOW_ALERT only (no split, no swaps, banks untouched)
window_ticks = 3
withdraw_enabled = true         # daily: withdraw_fraction x HWM gain since last withdrawal -> JupSOL (replaces old SOL nightly stake)
withdraw_time_mt = "00:05"
withdraw_fraction = 0.75
# Trevor 2026-10-11 06:53 MT: no $0.50 minimum; withdraw when amount_usd > withdraw_fee_factor x est. cost (SOL->JupSOL stake: ~0.1% route/stake fee, ~0.00005 SOL network)
withdraw_cost_pct = 0.001
withdraw_network_sol = 0.00005
withdraw_fee_factor = 2.0
fee_settle_min_sol = 0.005      # ETH/BTC: settle SOL network-fee debt (coin -> SOL) above this

[resting]
# Resting on-chain orders (Trevor spec 2026-10-11, approved 23:00 MT). NOT LIVE: every flag OFF until Trevor enables it.
# adds_enabled: next ladder add rests as a Jupiter limit-open order (Perps API) at the rung; no market add on the bar.
# partials_enabled: ONE partial TP per position, placed once trim is ARMED and adds are trim-eligible (sized to them), updated only on a new add, N trim levels (main + fine) beyond its entry,
#   N = 1 at the first add -> 4 at rung ladder_max_rungs (linear, rounded), fired trim_level_tol_atr before the level.
# last_partial_rule: the next add order must lie beyond the last partial price (adverse direction).
adds_enabled = true  # 2026-10-12 preset C/resting LIVE (Trevor 00:04 MT)
partials_enabled = true  # 2026-10-12 preset C/resting LIVE (Trevor 00:04 MT)
last_partial_rule = true  # 2026-10-12 preset C/resting LIVE (Trevor 00:04 MT)
partial_levels_min = 1
partial_levels_max = 4

[scale]
enabled = false             # SOL keeps its USD distances
own_atr_fallback = true     # analyst file missing/stale -> ladder on own 1h ATR (no S/R); same as ETH/BTC (2026-10-15)
